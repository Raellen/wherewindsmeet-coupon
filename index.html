<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

  .group { margin-top: 26px; }

  .row.done { opacity: .5; }
  .row.done .code { text-decoration: line-through; text-decoration-color: var(--ink-faint); }
  .row.done .copy { background: none; color: var(--ink-faint); }

  #toast {

  .author {

  #toTop {

    width: 44px; height: 44px; border-radius: 50%;

    border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(33,29,23,.14);

  #toTop:hover { border-color: var(--jade); background: var(--jade); color: var(--paper-raised); }

  footer { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = [
  { date: "無時限", tag: "No expiry", codes: ["TP78EF43YH","MQECJKF7AR","QSFXR8EE8D","XM8AQFRCPX","CP8WMH8W4C","NDETCQEXHF","APE6NNXY4K","FHHXEYRJAN","PJCXEP4MFT","KPC346C44A","swcqqqhwae","JJXDTKCD8Y","NK4AJFPDWC","TPCF3FEN6Y","NY4TTJKEKQ","PAM46YAQ86","EKMW673Q8A","SY3KQQE8KR","qtnjp7p4pc","WK7K8RY8JJ","EKNAPHAHYY","XRKPY6C38A","DHR7N8HR4R","TAC6PXMFAR","AWTE43FCP7","FHKD7HHWRJ","HD8PHDX443","NKTTCPETYC","KAAYFMX7HP","MKTQJR3DMA","RNTF3MMTMR","HSWW3NCEKY","HSM84QD8DQ","PXYR8M4AJJ","FXA7WPXP6C","HD4CRCHPTN","WH7PRYFFPA","MAWQA8HR48","ARN8KQJAET","RP68WW3NY6","QSD4JECMQD","NSAHT7AHKJ","YY3NQAJ7WJ","FN6AHA3T7N","SE3RNWEDAT","rycdp8mmnh","keryf4rxm4","kj4yf433mn","kwafcwdfjf","XQFWEQMKMX","krda7x3axy","cw4ap7aa6t","HK367A6FDJ","DTXHCJ6DNN","TD8XMRKJMK","THMQNAFXQC","YYP4QNC7NQ","hh6am6c8rf","TNHP8E8W3T","MFDTMT3YMA","PEE6RWWEFK","EJXXHKDHHK","tsy7rd6jtm","yryqhtneda","HOMESTEAD0625","WWMXATM0501"] },
  { date: "7/9", codes: ["JXT3CTJHWP"] },
  { date: "7/10", codes: ["MX8MYAYJ4Q"] },
  { date: "7/11", codes: ["NQP4YKKFJ4","RN8T4EWWD7"] },
  { date: "7/12", codes: ["wj8n4ahdmk","sck3jftf7m","jpp8wcwphe"] },
  { date: "7/16", codes: ["MEETINHM"] },
  { date: "7/23", codes: ["FINALTRUTH","0723HMGO","GOOSELOVEU"] },
  { date: "7/24", codes: ["GOOSELOVEU"] },
  { date: "7/31", codes: ["kpca7mf6kn"] },
  { date: "8/3", codes: ["BOSSSLAYER"] },
  { date: "8/6", codes: ["WWM20261114"] },
  { date: "8/10", codes: ["ewrwwjmxfk"] },
  { date: "8/17", codes: ["HM0820"] },
  { date: "8/19", codes: ["WWMR3DD1T01","HMCHAP2","AHPCTHCY8R"] },
  { date: "8/20", codes: ["SNY8KPX3FX","QPCAY66MNA","CC3ETYXWJE","ACT783EWC4","eecwt48nq3","FRF6KXEM6K","DQ8T6RFW8J"] },
  // 以下 8/21、8/22 部分來源:巴哈姆特哈啦板 214 樓
  { date: "8/21", codes: ["SNEXA3NDN3","TS8XM7Q6AJ","PHEK7MRDMP","FEJH7KMAHX","AQ3QRN6KNJ","wmkyn6pk8n","FJ6QXW7MQE","JAAJQQE6DJ","HXAFXWMTPH","CCXWDQPRD7","NN8QMK76MM","MDNH8NWQX3","MFPA3FWHJN","FQDHYY43TW"] },
  { date: "8/22", codes: ["CWDWTCX3DN","QCTY47Q6FT","CW6THCJ6KE","NXHAXHMM3Q","KYXCNQ6HHX","SYXNRNQJY4","CRKTTEHYDF","AFRT3KR4AK","TQJ4C6JRWW","FTWHQF4PEQ","SC8QWXKPCX","pfcaajkh86","HDECM8QA43"] },
  // 以下 8/23、8/24 部分來源:巴哈姆特哈啦板 234 樓
  { date: "8/23", codes: ["NY6METERNR","MA3KQT34E7","FRNPXAFDMF","FAHWP6RT6D","DC3NJWFR3N","HSP4QAQKJ7","QDRHQHECTA","QJAJ3DDMCP","HN7EQFTR34","TH76NQK7R7","MSNEX4FRN8","AHKRW8XJDF"] },
  { date: "8/24", codes: ["WJ6EMNH3J6","rhdj6wmt3j","JMM6HK76Y3","YDF3CNX38P"] },
  { date: "8/25", codes: ["CXDAK4R8D4"] },
  { date: "8/26", codes: ["RFXDYYAPDT","XMAEKXJEMF","PAPAME8NJD","RCPDRW4RTN","JDPCPT7FTM"] },
  { date: "8/27", codes: ["NERYRCTED6","EEC636TJKJ","MQJYHRRQYM","WYQD6YP4AP","NEVERLOOKBACK","CHYF4FX66Q","WHN8MW8EH6","HFAJ73PDJR","RKJJHNHENJ","PE6YENXR6A"] },
  { date: "8/28", codes: ["FC7HAXJRC3","HXEQC37XXE","MMDCN6HY6D","WHK7YFXCNY","EQMWPDJYKA","HHE7YWP4TC"] },
];

// each code entry may carry a "｜note"; the redeemable value is the part before ｜
const codeValue = raw => raw.split("｜")[0];

const KEY = "wwm-codes-done";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const save = () => localStorage.setItem(KEY, JSON.stringify([...done]));

const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';

const listEl = document.getElementById("list");
const toast = document.getElementById("toast");
let toastTimer;

const allCodes = DATA.flatMap(g => g.codes);
document.getElementById("totalCount").textContent =
  document.getElementById("footTotal").textContent = allCodes.length;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
  }
}

function markDone(raw, row) {
  done.add(raw); save(); row.classList.add("done"); updateStat();
}

function copyOne(raw, row) {
  const val = codeValue(raw);
  copy(val);
  showToast("已複製  " + val);
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 350);
  markDone(raw, row);
}

function updateStat() {
  document.getElementById("doneCount").textContent =
    allCodes.filter(c => done.has(c)).length;
}

function render(filter = "") {
  const f = filter.trim().toLowerCase();
  listEl.innerHTML = "";
  let shown = 0;

  // 儲存順序為舊→新;顯示時反向,讓新的(陣列尾端)排在上面
  [...DATA].reverse().forEach(group => {
    const matches = [...group.codes].reverse().filter(c => codeValue(c).toLowerCase().includes(f));
    if (!matches.length) return;
    shown += matches.length;

    const section = document.createElement("section");
    section.className = "group";
    section.innerHTML = `
      <div class="group-head">
        <span class="group-date">${group.date}${group.tag ? ` <span class="tag">${group.tag}</span>` : ""}</span>
        <span class="group-count">${matches.length} 組</span>
        <button class="group-copyall">複製整組</button>
      </div>
      <div class="list"></div>`;
    const rows = section.querySelector(".list");

    matches.forEach(raw => {
      const val = codeValue(raw);
      const note = raw.includes("｜") ? raw.split("｜")[1] : "";
      const row = document.createElement("div");
      row.className = "row" + (done.has(raw) ? " done" : "");
      const label = note
        ? `${val} <span style="color:var(--vermilion);font-size:12px;letter-spacing:0">（${note}）</span>`
        : val;
      row.innerHTML = `
        <span class="code" title="點擊複製">${label}</span>
        <button class="copy">${copyIcon}<span>複製</span></button>`;
      row.querySelector(".code").addEventListener("click", () => copyOne(raw, row));
      row.querySelector(".copy").addEventListener("click", () => copyOne(raw, row));
      rows.appendChild(row);
    });

    section.querySelector(".group-copyall").addEventListener("click", () => {
      const text = matches.map(codeValue).join("\n");
      copy(text);
      showToast(`已複製整組 ${matches.length} 組(換行分隔)`);
      matches.forEach(raw => done.add(raw));
      save();
      section.querySelectorAll(".row").forEach(r => r.classList.add("done"));
      updateStat();
    });

    listEl.appendChild(section);
  });

  if (!shown) listEl.innerHTML = `<p class="empty">找不到符合「${filter}」的兌換碼</p>`;
  updateStat();
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("reset").addEventListener("click", () => {
  if (!done.size) { showToast("目前沒有標記"); return; }
  done.clear(); save();
  render(document.getElementById("q").value);
  showToast("已清除所有標記");
});

render();

// 回到最上面按鈕
(() => {
  const btn = document.getElementById("toTop");
  if (!btn) return;
  const onScroll = () => btn.classList.toggle("show", window.scrollY > 400);
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
})();

// 拼裝回報信箱,避免以純文字被爬蟲收集
(() => {
  const el = document.getElementById("report");
  if (!el) return;
  const user = ["raellen", "chang"].join(".");
  const host = ["gmail", "com"].join(".");
  const subject = encodeURIComponent("燕雲兌換碼失效回報");
  el.addEventListener("click", e => {
    e.preventDefault();
    location.href = `mailto:${user}@${host}?subject=${subject}`;
  });
})();
</script>
