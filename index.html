<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

  }
  :root[data-theme="dark"] {
    --paper: #17150f;
    --paper-raised: #201d15;
    --ink: #ece5d6;
    --ink-soft: #b0a891;

  .sub.note { margin-top: 8px; font-size: 13px; color: var(--ink-faint); }
  .path { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--ink); }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    padding: 14px 0; margin-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .search {
    flex: 1 1 200px; min-width: 0;

    background: var(--paper-raised); border: 1px solid var(--line);

  }
  .search:focus-within { border-color: var(--jade); box-shadow: 0 0 0 3px var(--jade-tint); }
  .search svg { flex: none; color: var(--ink-faint); }
  .search input {
    border: none; background: none; outline: none; width: 100%;
    color: var(--ink); font-size: 15px; font-family: inherit;
  }
  .stat { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat b { color: var(--jade); font-weight: 600; }
  .ghost {
    font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 8px; padding: 8px 12px; transition: .15s;
  }
  .ghost:hover { border-color: var(--jade); color: var(--jade); }

  .group { margin-top: 26px; }
  .group-head {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--line-soft);
  }
  .group-date {
    font-family: Georgia, serif; font-size: 18px; font-weight: 600; color: var(--ink);
  }
  .group-date .tag {
    font-family: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); margin-left: 2px;
  }
  .group-count { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .group-copyall {
    margin-left: auto; font: inherit; font-size: 12px; cursor: pointer;
    background: none; border: none; color: var(--jade); padding: 2px 4px;
    border-bottom: 1px solid transparent;
  }
  .group-copyall:hover { border-bottom-color: var(--jade-deep); }

  .list { display: grid; gap: 7px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px 4px 4px 14px;
    box-shadow: var(--shadow); transition: border-color .15s, opacity .15s;
  }
  .row:hover { border-color: color-mix(in srgb, var(--jade) 40%, var(--line)); }
  .code {
    flex: 1 1 auto; min-width: 0;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: clamp(15px, 3.6vw, 17px); letter-spacing: .04em;
    color: var(--ink); cursor: pointer; user-select: all;
    padding: 8px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .copy {
    flex: none; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--jade-tint); color: var(--jade);
    border: 1px solid transparent; border-radius: 7px; padding: 8px 13px;
    transition: .15s;
  }
  .copy:hover { background: var(--jade); color: var(--paper-raised); }
  .copy svg { width: 14px; height: 14px; }

  .row.done { opacity: .5; }
  .row.done .code { text-decoration: line-through; text-decoration-color: var(--ink-faint); }
  .row.done .copy { background: none; color: var(--ink-faint); }
  .row.flash { border-color: var(--jade); }

  .empty { text-align: center; color: var(--ink-faint); padding: 60px 0; font-size: 15px; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500;
    padding: 11px 20px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .author {
    margin-top: 46px; padding: 18px;
    display: flex; align-items: center; gap: 16px;
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow);
  }
  .author-avatar {
    position: relative; flex: none;
    width: 100px; height: 100px; border-radius: 100%;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--jade-tint), var(--paper));
    border: 1px solid var(--jade-deep);
    font-family: Georgia, "Songti TC", "Noto Serif TC", serif;
    font-size: 30px; font-weight: 600; color: var(--jade);

  .author-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .author-info { min-width: 0; }
  .author-name {
    margin: 0; font-family: Georgia, "Songti TC", "Noto Serif TC", serif;
    font-size: 22px; font-weight: 600; letter-spacing: .04em;
  }
  .author-id {
    margin: 6px 0 0; font-size: 13px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .author-id .path { font-variant-numeric: tabular-nums; user-select: all; }
  .idcopy {
    font: inherit; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--jade-tint); color: var(--jade);
    border: 1px solid transparent; border-radius: 6px; padding: 3px 8px;
    transition: .15s;
  }
  .idcopy:hover { background: var(--jade); color: var(--paper-raised); }
  .idcopy svg { width: 12px; height: 12px; }
  .author-tag { margin: 8px 0 0; font-size: 12px; color: var(--ink-faint); letter-spacing: .06em; }

  footer { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = [
  { date: "8/21", codes: ["HXAFXWMTPH","JAAJQQE6DJ","FJ6QXW7MQE","wmkyn6pk8n","AQ3QRN6KNJ","FEJH7KMAHX","PHEK7MRDMP","TS8XM7Q6AJ","SNEXA3NDN3"] },

  { date: "8/19", codes: ["AHPCTHCY8R","HMCHAP2","WWMR3DD1T01"] },
  { date: "8/18", codes: ["CCPDDACMN8"] },

  { date: "7/27", codes: ["xfde6777hx","QYM8CN3D6R","mmchh3awyd","mf3t3q7jdd","qs6ndhjyam","fcac4fnrqf","drac3pqehy","hx37dk8d7y","cymkp48wmq","tj3xcywwr3"] },
  { date: "7/26", codes: ["JPYFEX7XF7","PTQNXR3FTQ","RKKF4DNYPD","QH3PH847T3","FX7TQMEKAH","jrnhdch8qd","HSAW8CEAFP","WRTJWQKWAW","wknmdn3npq","myx4nqmffx","wnhmwa337m","wetx4tfctf","ypyfrcrxpy","yje3a74waq","rf4rnqekpc","tkeerpwfyj","tpmc63xw43","nsnpfnkhep","ya8tahp88k","nkd78hq6dd","ncd3863wda","pmnf447mpw","qcmr86maec","eydajhqywd","jwepj6nthf","kcf38qken3","xty6774djh","rjnaaxcqkj","dxwa6mkk87","hr648q8r3q","mprh8dekqq","qf73hnhxtd","sj8866ycdt"] },
  { date: "7/24", codes: ["ks8n4te83k","wtdja7j6n6","hp6pmxj48f","kry7cwy3kd","nmkk6nwwff","XENFQR6RFF","SK7HREDTT3","RSPQME7JFW","fsa7jnantp","dfpyc6dpxq","dqjxnyqnj4","kc6t677dry","hyxjrta37f","wm8e7jjf47","GOOSELOVEU","hxy33fxefm","mn6mxf8qpe","CH8AJWFRRR","QMQW7RQJT6","CYMWMFCJDH","SYDHTJ8QAT","HYXJRTA37F","RAHKHCDYHT","QY6C3RMFJD","EAE36WQHHD","DNKDEWK6FC","EMNQMYM38P"] },
  { date: "7/23", codes: ["GOOSELOVEU","0723HMGO","FINALTRUTH"] },
  { date: "7/16", codes: ["MEETINHM"] },
  { date: "7/12", codes: ["jpp8wcwphe","sck3jftf7m","wj8n4ahdmk"] },
  { date: "7/11", codes: ["RN8T4EWWD7","NQP4YKKFJ4"] },
  { date: "7/10", codes: ["MX8MYAYJ4Q"] },
  { date: "7/9", codes: ["JXT3CTJHWP"] },
  { date: "無時限", tag: "No expiry", codes: ["WWMXATM0501","HOMESTEAD0625","GOHOME123","yryqhtneda","tsy7rd6jtm","EJXXHKDHHK","PEE6RWWEFK","MFDTMT3YMA","TNHP8E8W3T","hh6am6c8rf","YYP4QNC7NQ","THMQNAFXQC","TD8XMRKJMK","DTXHCJ6DNN","HK367A6FDJ","cw4ap7aa6t","krda7x3axy","XQFWEQMKMX","kwafcwdfjf","kj4yf433mn","keryf4rxm4","rycdp8mmnh","SE3RNWEDAT","FN6AHA3T7N","YY3NQAJ7WJ","NSAHT7AHKJ","QSD4JECMQD","RP68WW3NY6","ARN8KQJAET","MAWQA8HR48","WH7PRYFFPA","HD4CRCHPTN","FXA7WPXP6C","PXYR8M4AJJ","HSM84QD8DQ","HSWW3NCEKY","RNTF3MMTMR","MKTQJR3DMA","KAAYFMX7HP","NKTTCPETYC","HD8PHDX443","FHKD7HHWRJ","AWTE43FCP7","TAC6PXMFAR","DHR7N8HR4R","XRKPY6C38A","EKNAPHAHYY","WK7K8RY8JJ","qtnjp7p4pc","SY3KQQE8KR","EKMW673Q8A","PAM46YAQ86","NY4TTJKEKQ","TPCF3FEN6Y","NK4AJFPDWC","JJXDTKCD8Y","swcqqqhwae","KPC346C44A","PJCXEP4MFT","FHHXEYRJAN","APE6NNXY4K","NDETCQEXHF","CP8WMH8W4C","XM8AQFRCPX","QSFXR8EE8D","MQECJKF7AR","TP78EF43YH"] },
];

// each code entry may carry a "｜note"; the redeemable value is the part before ｜
const codeValue = raw => raw.split("｜")[0];

const KEY = "wwm-codes-done";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const save = () => localStorage.setItem(KEY, JSON.stringify([...done]));

const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';

const listEl = document.getElementById("list");
const toast = document.getElementById("toast");
let toastTimer;

const allCodes = DATA.flatMap(g => g.codes);
document.getElementById("totalCount").textContent =
  document.getElementById("footTotal").textContent = allCodes.length;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
  }
}

function markDone(raw, row) {
  done.add(raw); save(); row.classList.add("done"); updateStat();
}

function copyOne(raw, row) {
  const val = codeValue(raw);
  copy(val);
  showToast("已複製  " + val);
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 350);
  markDone(raw, row);
}

function updateStat() {
  document.getElementById("doneCount").textContent =
    allCodes.filter(c => done.has(c)).length;
}

function render(filter = "") {
  const f = filter.trim().toLowerCase();
  listEl.innerHTML = "";
  let shown = 0;

  DATA.forEach(group => {
    const matches = group.codes.filter(c => codeValue(c).toLowerCase().includes(f));
    if (!matches.length) return;
    shown += matches.length;

    const section = document.createElement("section");
    section.className = "group";
    section.innerHTML = `
      <div class="group-head">
        <span class="group-date">${group.date}${group.tag ? ` <span class="tag">${group.tag}</span>` : ""}</span>
        <span class="group-count">${matches.length} 組</span>
        <button class="group-copyall">複製整組</button>
      </div>
      <div class="list"></div>`;
    const rows = section.querySelector(".list");

    matches.forEach(raw => {
      const val = codeValue(raw);
      const note = raw.includes("｜") ? raw.split("｜")[1] : "";
      const row = document.createElement("div");
      row.className = "row" + (done.has(raw) ? " done" : "");
      const label = note
        ? `${val} <span style="color:var(--vermilion);font-size:12px;letter-spacing:0">（${note}）</span>`
        : val;
      row.innerHTML = `
        <span class="code" title="點擊複製">${label}</span>
        <button class="copy">${copyIcon}<span>複製</span></button>`;
      row.querySelector(".code").addEventListener("click", () => copyOne(raw, row));
      row.querySelector(".copy").addEventListener("click", () => copyOne(raw, row));
      rows.appendChild(row);
    });

    section.querySelector(".group-copyall").addEventListener("click", () => {
      const text = matches.map(codeValue).join("\n");
      copy(text);
      showToast(`已複製整組 ${matches.length} 組(換行分隔)`);
      matches.forEach(raw => done.add(raw));
      save();
      section.querySelectorAll(".row").forEach(r => r.classList.add("done"));
      updateStat();
    });

    listEl.appendChild(section);
  });

  if (!shown) listEl.innerHTML = `<p class="empty">找不到符合「${filter}」的兌換碼</p>`;
  updateStat();
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("reset").addEventListener("click", () => {
  if (!done.size) { showToast("目前沒有標記"); return; }
  done.clear(); save();
  render(document.getElementById("q").value);
  showToast("已清除所有標記");
});

render();

// 複製角色編號
(() => {
  const btn = document.getElementById("idcopy");
  if (!btn) return;
  btn.addEventListener("click", () => {
    copy("3062024361");
    showToast("已複製角色編號  3062024361");
  });
})();

// 拼裝回報信箱,避免以純文字被爬蟲收集
(() => {
  const el = document.getElementById("report");
  if (!el) return;
  const user = ["raellen", "chang"].join(".");
  const host = ["gmail", "com"].join(".");
  const subject = encodeURIComponent("燕雲兌換碼失效回報");
  el.addEventListener("click", e => {
    e.preventDefault();
    location.href = `mailto:${user}@${host}?subject=${subject}`;
  });
})();
</script>
