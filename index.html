const LANG_KEY = "wwm-lang";
function detectLang() {
  const stored = localStorage.getItem(LANG_KEY);
  if (stored && I18N[stored]) return stored;
  const navs = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ""];
  for (const n of navs) {
    const primary = n.toLowerCase().split("-")[0];
    if (primary === "zh") return "zh";
    if (I18N[primary]) return primary;
  }
  return "en";
}
let lang = detectLang();
const t = () => I18N[lang];

const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };

function applyLang() {
  const d = t();
  document.documentElement.lang = d.htmlLang;
  document.title = d.docTitle;
  setText("eyebrow", d.eyebrow);
  setText("title", d.title);
  setText("updatedLabel", d.updatedLabel);
  document.getElementById("intro").innerHTML = d.intro;
  document.getElementById("note").innerHTML = d.note;
  setText("authorBtnText", d.authorBtn);
  document.getElementById("q").placeholder = d.searchPlaceholder;
  setText("statLabel", d.statLabel);
  setText("reset", d.reset);
  setText("authorName", d.authorName);
  setText("authorIdLabel", d.authorIdLabel);
  setText("idCopyText", d.idCopy);
  setText("authorTag", d.authorTag);
  document.getElementById("footer").textContent = d.footer(allCodes.length);
  const tt = document.getElementById("toTop");
  if (tt) { tt.title = d.toTop; tt.setAttribute("aria-label", d.toTop); }
  setText("navBrandText", d.navBrand);
  const sel = document.getElementById("langSelect");
  if (sel) sel.value = lang;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
  }
}

function markDone(raw, row) {
  done.add(raw); save(); row.classList.add("done"); updateStat();
}

function copyOne(raw, row) {
  const val = codeValue(raw);
  copy(val);
  showToast(t().copied(val));
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 350);
  markDone(raw, row);
}

function updateStat() {
  document.getElementById("doneCount").textContent =
    allCodes.filter(c => done.has(c)).length;
}

const MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
// 英文版把 "8/30" 顯示成 "Aug 30";中文維持原樣
function fmtDate(str) {
  if (lang !== "en") return str;
  const m = str.match(/^(\d{1,2})\/(\d{1,2})$/);
  return m ? `${MONTHS_EN[+m[1] - 1]} ${+m[2]}` : str;
}

function render(filter = "") {
  const f = filter.trim().toLowerCase();
  listEl.innerHTML = "";
  let shown = 0;

  const d = t();
  // 儲存順序為舊→新;顯示時反向,讓新的(陣列尾端)排在上面
  [...DATA].reverse().forEach(group => {
    const matches = [...group.codes].reverse().filter(c => codeValue(c).toLowerCase().includes(f));
    if (!matches.length) return;
    shown += matches.length;

    const dateLabel = group.date === "無時限" ? d.noExpiry : fmtDate(group.date);
    const tagHtml = (group.tag && lang === "zh") ? ` <span class="tag">${group.tag}</span>` : "";
    const section = document.createElement("section");
    section.className = "group";
    section.innerHTML = `
      <div class="group-head">
        <span class="group-date">${dateLabel}${tagHtml}</span>
        <span class="group-count">${d.groupCount(matches.length)}</span>
        <button class="group-copyall">${d.copyAll}</button>
      </div>
      <div class="list"></div>`;
    const rows = section.querySelector(".list");

    matches.forEach(raw => {
      const val = codeValue(raw);
      const note = raw.includes("｜") ? raw.split("｜")[1] : "";
      const row = document.createElement("div");
      row.className = "row" + (done.has(raw) ? " done" : "");
      const label = note
        ? `${val} <span style="color:var(--vermilion);font-size:12px;letter-spacing:0">（${note}）</span>`
        : val;
      row.innerHTML = `
        <span class="code" title="${d.codeTitle}">${label}</span>
        <button class="copy">${copyIcon}<span>${d.copy}</span></button>`;
      row.querySelector(".code").addEventListener("click", () => copyOne(raw, row));
      row.querySelector(".copy").addEventListener("click", () => copyOne(raw, row));
      rows.appendChild(row);
    });

    section.querySelector(".group-copyall").addEventListener("click", () => {
      const text = matches.map(codeValue).join("\n");
      copy(text);
      showToast(t().copiedGroup(matches.length));
      matches.forEach(raw => done.add(raw));
      save();
      section.querySelectorAll(".row").forEach(r => r.classList.add("done"));
      updateStat();
    });

    listEl.appendChild(section);
  });

  if (!shown) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = t().empty(filter);
    listEl.appendChild(p);
  }
  updateStat();
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("reset").addEventListener("click", () => {
  if (!done.size) { showToast(t().noMarks); return; }
  done.clear(); save();
  render(document.getElementById("q").value);
  showToast(t().cleared);
});

// 語言選單:填入選項並綁定切換
(() => {
  const sel = document.getElementById("langSelect");
  sel.innerHTML = Object.entries(I18N)
    .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
  sel.value = lang;
  sel.addEventListener("change", e => {
    lang = e.target.value;
    localStorage.setItem(LANG_KEY, lang);
    applyLang();
    render(document.getElementById("q").value);
  });
})();

applyLang();
render();

// 回到最上面按鈕
(() => {
  const btn = document.getElementById("toTop");
  if (!btn) return;
  const onScroll = () => btn.classList.toggle("show", window.scrollY > 400);
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
})();
